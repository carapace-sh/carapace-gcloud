# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: observability
description: Manage Observability resources.
commands:
    - name: scopes
      description: Manage Scope resources.
      commands:
        - name: describe
          description: Describe scopes.
          flags:
            --location=: The location id of the scope resource.
        - name: update
          description: Update scopes.
          flags:
            --location=: The location id of the scope resource.
            --log-scope=: The full resource name of the `LogScope`.
            --trace-scope=: The resource name of the `TraceScope`.
    - name: trace-scopes
      description: Manage Trace Scope resources.
      commands:
        - name: create
          description: Create traceScopes.
          flags:
            --description=: Describes this trace scope.
            --location=: The location id of the traceScope resource.
            --resource-names=!: Names of the projects that are included in this trace scope.
        - name: delete
          description: Delete traceScopes.
          flags:
            --location=: The location id of the traceScope resource.
        - name: describe
          description: Describe traceScopes.
          flags:
            --location=: The location id of the traceScope resource.
        - name: list
          description: List traceScopes.
          flags:
            --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            --limit=: Maximum number of resources to list.
            --location=!: ID of the location or fully qualified identifier for the location.
            --no-uri&: Print a list of resource URIs instead of the default output, and change the
            --page-size=: Some services group resource list output into pages.
            --sort-by=: Comma-separated list of resource field key names to sort by.
            --uri: Print a list of resource URIs instead of the default output, and change the
        - name: update
          description: Update traceScopes.
          flags:
            --description=: Describes this trace scope.
            --location=: The location id of the traceScope resource.
            --resource-names=: Names of the projects that are included in this trace scope.
