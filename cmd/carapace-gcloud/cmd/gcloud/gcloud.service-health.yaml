# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: service-health
description: Request events that are relevant to your project or organization.
commands:
    - name: events
      description: Represents events that may affect Google Cloud products.
      commands:
        - name: describe
          description: Get details of an event affecting a project.
          flags:
            --location=: The location to use when working with Service Health resources.
        - name: list
          description: List events under a given project and location.
          flags:
            --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            --limit=: Maximum number of resources to list.
            --location=: ID of the location or fully qualified identifier for the location.
            --no-uri&: Print a list of resource URIs instead of the default output, and change the
            --page-size=: Some services group resource list output into pages.
            --sort-by=: Comma-separated list of resource field key names to sort by.
            --uri: Print a list of resource URIs instead of the default output, and change the
            --view=: Event fields to include in response.
          completion:
            flag:
                view:
                    - event-view-basic
                    - event-view-full
    - name: organization-events
      description: Represents events that may affect products used across the organization.
      commands:
        - name: describe
          description: Get details of an event affecting an organization.
          flags:
            --location=: The location to use when working with Service Health resources.
            --organization=: The organization id of the organizationEvent resource.
        - name: list
          description: List events under a given organization and location.
          flags:
            --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            --limit=: Maximum number of resources to list.
            --location=: ID of the location or fully qualified identifier for the location.
            --no-uri&: Print a list of resource URIs instead of the default output, and change the
            --organization=: The organization id of the location resource.
            --page-size=: Some services group resource list output into pages.
            --sort-by=: Comma-separated list of resource field key names to sort by.
            --uri: Print a list of resource URIs instead of the default output, and change the
            --view=: OrganizationEvent fields to include in response.
          completion:
            flag:
                view:
                    - organization-event-view-basic
                    - organization-event-view-full
    - name: organization-impacts
      description: Represents impact to assets at organizational level.
      commands:
        - name: describe
          description: Get details of an asset impact by an event under an organization.
          flags:
            --location=: The location to use when working with Service Health resources.
            --organization=: The organization id of the organizationImpact resource.
        - name: list
          description: List assets impacted by events under an organization.
          flags:
            --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            --limit=: Maximum number of resources to list.
            --location=: ID of the location or fully qualified identifier for the location.
            --no-uri&: Print a list of resource URIs instead of the default output, and change the
            --organization=: The organization id of the location resource.
            --page-size=: Some services group resource list output into pages.
            --sort-by=: Comma-separated list of resource field key names to sort by.
