# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: workload-identity
description: Manage Workload Identity.
commands:
    - name: service-agents
      description: Manage Service Agents for Workload Identity.
      commands:
        - name: generate
          description: Generate service agents for a service producer.
          flags:
            --folder=: The folder number to generate service agents for.
            --location=: The location for which to generate the service agents.
            --organization=: The organization number to generate service agents for.
            --service=!: The service producer to generate service agents for (e.g. bigquery.googleapis.com).
