        - name: monitoring-points
          description: A Monitoring Point is an agent within your network or application infrastructure that sends probes and reports the results to AppNeta.
          commands:
            - name: describe
              description: Describe a Monitoring Point.
              flags:
                --location=: The location id of the monitoringPoint resource.
                --network-monitoring-provider=: The networkMonitoringProvider id of the monitoringPoint resource.
            - name: download-install-script
              description: Download an installation script for a Monitoring Point.
              flags:
                --dns-server-address=: Primary DNS server address.
                --dns-server-secondary-address=: Secondary DNS server address.
                --domain=: Domain name of the Monitoring Point.
                --gateway-address=: Gateway IP address.
                --hostname=!: 'The hostname of the Monitoring Point (example: `test-vm`).'
                --location=!: The location of the Network Monitoring Provider (example:, `global`).
                --monitoring-point-type=!: The type of the Monitoring Point.
                --netmask=: 'Network mask (example: "255.255.255.0"). Used with `--static-ip-address`.'
                --network-monitoring-provider=!: The ID of the Network Monitoring Provider.
                --no-use-dhcp&: Whether to use DHCP for IP address configuration.
                --ntp-server-address=: Primary NTP server address (IP address or FQDN).
                --ntp-server-secondary-address=: Secondary NTP server address (IP address or FQDN).
                --output-file=!: The path to save the downloaded install script.
                --password=: Password for logging into the Monitoring Point.
                --static-ip-address=: Static IP address of the Monitoring Point.
                --time-zone=: 'Time zone ID for the Monitoring Point (example:  `America/Los_Angeles`).'
                --use-dhcp: Whether to use DHCP for IP address configuration.
              completion:
